name = "gui"
version = "1.10.0"
# abi 是「编译此包所依据的标准库 ABI」（STDLIB_ABI=6），不是 gui 包自己的
# 版本号；gui.diali 契约变更由 .diali 的 SHA256 校验保证，故 abi 保持 6。
abi = 6
iface = "gui.diali"
license = "MIT OR Apache-2.0"

# 键名必须与编译器 package::host_triple() 的取值**逐字一致**
# （x86_64-linux-gnu / aarch64-unknown-linux-musl / x86_64-pc-windows-gnu），
# 否则用户装上包后，编译器按 host_triple() 选不到机器码。
#
# 三份 .a 都是**真实现**：linux-gnu / musl 走 X11 + XShm + XRender 后端，
# windows-gnu 走 Win32 GDI 后端。平台库一律 dlopen 动态装载，.a 自包含，
# 不需要用户写 link，也不需要链接期注入 -lX11 / -lgdi32。
[targets]
x86_64-linux-gnu = "lib/x86_64-linux-gnu/libgui.a"
aarch64-unknown-linux-musl = "lib/aarch64-unknown-linux-musl/libgui.a"
x86_64-pc-windows-gnu = "lib/x86_64-pc-windows-gnu/libgui.a"
