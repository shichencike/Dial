# dialc —— 三平台编译 / 测试 / 发布流水线（GitHub Actions）
#
# 三个构建作业，各平台**原生构建**（CI 用对应宿主 runner / 容器，编译期目标即运行期平台）：
#   build-linux     Linux x86_64（动态 glibc）—— 全量 A~L 端到端测试 + 锚点/官网同步校验
#   build-windows   Windows x64（MinGW / gnu）—— 核心冒烟（编译+运行+平台契约）
#   build-termux    Termux aarch64（musl 全静态）—— 核心冒烟
# 发布作业在打 `v*` 标签时把三个平台的产物上传到 GitHub Release。
#
# 平台决策（用户拍板 + 工具链可得性约束）：
#   - Linux x86_64      : glibc 动态链接，运行期需要系统 libLLVM-18
#   - Windows x64       : MinGW（x86_64-pc-windows-gnu）。LLVM 用官方 MSVC 构建的 18 全量包，
#                         仅取 C 接口（LLVM-C.lib 导入库 + LLVM-C.dll 运行期），纯 C ABI 跨工具链无冲突；
#                         stdlib 的 pthread 代码由 winpthreads 提供，无需改写（阶段 6 的 Win32 后端可延后）。
#   - Termux aarch64    : musl 全静态（单文件、无外部依赖），在原生 ARM64 宿主
#                         （ubuntu-24.04-arm）的 Alpine aarch64 容器内构建。
#   注：LLVM 18 必须保留——Alpine 3.22 恰好只提供 llvm18，升版会断 Termux 路线。
#   注：MSYS2 现仅提供 LLVM 23、WinLibs 的 18.x 已下架，故 Windows 走官方 MSVC 包 + C 接口路线。

name: CI

on:
  push:
    branches: [main]
    # v* ＝ 编译器（dialc）发布；stdlib-v* ＝ 官方标准库独立发布（阶段 7，与编译器解耦）
    tags: ["v*", "stdlib-v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Linux x86_64 —— 全量测试（A~L 十二组）+ 文档/官网同步校验
  # ===========================================================================
  build-linux:
    name: Linux x86_64（全量测试）
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 LLVM 18 与工具链
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget gnupg ca-certificates lsb-release software-properties-common \
            zip unzip python3 python3-venv python3-pip build-essential
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18 all
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libpolly-18-dev clang-18 zlib1g-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          clang --version | head -1
          llvm-config-18 --version

      - name: 安装 Python 依赖（官网生成器）
        run: |
          set -euo pipefail
          python3 -m venv /tmp/webvenv
          /tmp/webvenv/bin/pip install --quiet --upgrade pip
          /tmp/webvenv/bin/pip install --quiet "markdown==3.10.1"
          /tmp/webvenv/bin/python -c "import markdown; print('markdown', markdown.__version__)"
          echo "WEBPY=/tmp/webvenv/bin/python" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 编译 dialc（release）
        run: cargo build --release --locked

      # 阶段 7：预编译官方标准库（runtime + stdlib）为单份静态库，供发布 stdlib.dialpkg。
      - name: 构建标准库静态库（x86_64-linux-gnu）
        run: bash tools/build_stdlib.sh dist-stdlib/x86_64-linux-gnu/libdial_std.a 1

      - name: 上传标准库静态库（x86_64-linux-gnu）
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-x86_64-linux-gnu
          path: dist-stdlib/x86_64-linux-gnu/libdial_std.a
          if-no-files-found: error
          retention-days: 7

      - name: 端到端测试（A~L 共十二组）
        run: bash tests/run_tests.sh

      - name: 校验内部锚点（README / CHANGELOG）
        run: python3 tools/check_links.py

      - name: 校验官网产物与文档同步
        run: |
          set -euo pipefail
          "$WEBPY" tools/build_web.py
          if ! git diff --exit-code -- web/; then
            echo "::error::web/ 与文档不同步，请本地运行 python3 tools/build_web.py 后提交 web/"
            git diff --stat -- web/
            exit 1
          fi
          echo "✅ web/ 与文档同步"

      - name: 打包发布 zip（linux-x86_64）
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash tools/package_release.sh linux-x86_64 target/release/dialc

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-linux-x86_64
          path: dialc-v*-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Windows x64（MinGW / gnu）—— 核心冒烟
  # ===========================================================================
  build-windows:
    name: Windows x64（MinGW 核心冒烟）
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      # 注意：Windows 上 Rust 的 Command::new 对无扩展名路径只补 .exe、不补 .cmd，
      # 因此旧版 .cmd 垫片无法被 llvm-sys 解析（表现为 No suitable version of LLVM）。
      # 改为把 C:\llvm-shim\bin 放进 PATH，让 llvm-sys 在 PATH 中按 PATHEXT 裸名找到
      # 我们由 tools/llvm-config-win-shim.c 编译出的**真正的 llvm-config.exe**（见下方步骤）。
      LLVM18_DIR: C:\llvm18

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 MinGW-w64（gcc + winpthreads，供编译用户程序）
        shell: bash
        run: choco install mingw -y

      - name: 定位 MinGW 并写入 PATH（choco 不会跨步骤持久化 PATH）
        shell: bash
        run: |
          set -euo pipefail
          MINGW_BIN=""
          for d in /c/ProgramData/mingw64/mingw64/bin /c/tools/mingw64/bin; do
            if [ -x "$d/gcc.exe" ]; then MINGW_BIN="$d"; break; fi
          done
          [ -n "$MINGW_BIN" ] || { echo "❌ 未找到 MinGW gcc"; exit 1; }
          echo "MINGW_BIN=$MINGW_BIN" >> "$GITHUB_ENV"
          # 写入 GITHUB_PATH 后，后续所有步骤（build / 冒烟）都能通过 PATH 找到 gcc.exe
          echo "$MINGW_BIN" >> "$GITHUB_PATH"
          "$MINGW_BIN/gcc.exe" --version | head -1

      - name: 下载并解压官方 LLVM 18（MSVC 全量包，提供 C 接口：LLVM-C.lib / LLVM-C.dll / 头文件）
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o /tmp/llvm18.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz
          mkdir -p "$LLVM18_DIR"
          tar -xf /tmp/llvm18.tar.xz -C "$LLVM18_DIR" --strip-components=1
          ls "$LLVM18_DIR/bin/LLVM-C.dll" "$LLVM18_DIR/lib/LLVM-C.lib"

      - name: 编译并放置 llvm-config 垫片（真正的 .exe，让 llvm-sys 只链 LLVM-C）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /c/llvm-shim/bin
          # 必须生成**真正的 .exe**（不能用 .cmd/.bat）：
          #   llvm-sys 在 Windows 上先尝试 "llvm-config.exe"，再尝试裸名；
          #   而 CreateProcess 对不带扩展名的名字只补 ".exe"、不补 ".cmd"，
          #   所以批处理垫片永远不会被找到（表现为 No suitable version of LLVM）。
          # gcc 由「定位 MinGW」步骤写入的 GITHUB_PATH 提供。
          gcc -O2 -o /c/llvm-shim/bin/llvm-config.exe tools/llvm-config-win-shim.c
          "/c/llvm-shim/bin/llvm-config.exe" --version
          "/c/llvm-shim/bin/llvm-config.exe" --libnames --link-static
          # GNU ld 的 -lLLVM-C 按 lib<name>.a 查找；MSVC 导入库名为 LLVM-C.lib，
          # 补一份同内容副本，确保链接器一定能解析到。
          cp "$LLVM18_DIR/lib/LLVM-C.lib" "$LLVM18_DIR/lib/libLLVM-C.a"
          ls -la "$LLVM18_DIR/lib/LLVM-C.lib" "$LLVM18_DIR/lib/libLLVM-C.a" "$LLVM18_DIR/bin/LLVM-C.dll"

      - name: 安装 Rust 工具链并加 MinGW 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 编译 dialc（release，x86_64-pc-windows-gnu）
        shell: bash
        env:
          # 关键：build 步 PATH **不能**包含 C:\llvm18\bin——官方 MSVC 包自带真正的
          # llvm-config.exe，会盖过我们的 .cmd 垫片，报 "LLVM-18.dll is missing"。
          # 只留 C:\llvm-shim\bin（垫片）；MinGW gcc 已通过「定位 MinGW」写入 GITHUB_PATH。
          # 链接所需的 LLVM-C.lib 由垫片返回的 -L C:\llvm18\lib 提供，无需 bin 在 PATH。
          PATH: C:\llvm-shim\bin:$PATH
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          set -euo pipefail
          # windows-2022 runner 已预装 rustup，dtolnay action 不会把 cargo 写进 PATH，需手动补
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          cargo build --release --target x86_64-pc-windows-gnu --locked
          ls -la target/x86_64-pc-windows-gnu/release/dialc.exe

      - name: 诊断 dialc.exe 的 DLL 依赖
        shell: bash
        env:
          PATH: C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          BIN=target/x86_64-pc-windows-gnu/release/dialc.exe
          echo "--- COFF 导入表（LLVM / MinGW 运行时）---"
          llvm-readobj --coff-imports "$BIN" 2>/dev/null | grep -iE "LLVM|gcc|winpthread|stdc" || true
          ls -la "$BIN"

      - name: 核心冒烟：编译并运行示例
        shell: bash
        env:
          PATH: C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          # dialc 按 gcc -> clang -> zig -> cc 的顺序挑选 C 编译器。GITHUB_PATH 的追加
          # 并未覆盖到本步，若不显式前置 MinGW，dialc 会退到 Git Bash 的 cc（实际不可用，
          # 编译 stdlib/runtime 时静默失败）。这里把 MinGW 提到 PATH 最前。
          export PATH="$MINGW_BIN:$PATH"
          command -v gcc && gcc --version | head -1
          BIN=target/x86_64-pc-windows-gnu/release/dialc.exe
          D=$(dirname "$BIN")
          # Windows 加载 DLL 时**优先搜索可执行文件所在目录**：把运行期依赖
          # （LLVM-C.dll 与 MinGW 运行时 DLL）复制到 dialc.exe 同目录，确保必定能加载。
          # 编译用户程序需要 gcc（已由「定位 MinGW」步骤写入 GITHUB_PATH）。
          cp "$LLVM18_DIR/bin/LLVM-C.dll" "$D/"
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            if [ -f "$MINGW_BIN/$dll" ]; then cp "$MINGW_BIN/$dll" "$D/"; fi
          done
          ls -la "$D"/*.dll || true
          "$BIN" --version 2>/dev/null || true
          "$BIN" build examples/hello.dial -o /tmp/hello.exe
          ls -la /tmp/hello.exe
          /tmp/hello.exe | tee /tmp/hello.out
          grep -q "Hello, dialc" /tmp/hello.out && echo "✅ Windows 冒烟通过" || { echo "❌ 输出不符"; exit 1; }

      - name: 平台契约：用户程序不依赖 LLVM-C.dll
        shell: bash
        env:
          PATH: C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$PATH"
          BIN=target/x86_64-pc-windows-gnu/release/dialc.exe
          "$BIN" build examples/hello.dial -o /tmp/hello2.exe
          # 用 llvm-readobj / dumpbin 检查导入表：只允许系统 DLL，不应出现 LLVM-C.dll（那是 dialc.exe 自己的依赖）
          if command -v llvm-readobj >/dev/null 2>&1; then
            IMPORTS=$(llvm-readobj --coff-imports /tmp/hello2.exe 2>/dev/null | grep -i "LLVM" || true)
          else
            IMPORTS=""
          fi
          if [ -n "$IMPORTS" ]; then echo "❌ 用户程序依赖 LLVM"; echo "$IMPORTS"; exit 1; fi
          echo "✅ 用户程序无 LLVM 依赖"

      # 阶段 7：预编译官方标准库（runtime + stdlib）为单份静态库（MinGW gcc 产 .a）。
      - name: 构建标准库静态库（x86_64-pc-windows-gnu）
        shell: bash
        env:
          PATH: C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          export PATH="$MINGW_BIN:$PATH"
          command -v gcc && gcc --version | head -1
          bash tools/build_stdlib.sh dist-stdlib/x86_64-pc-windows-gnu/libdial_std.a 1

      - name: 上传标准库静态库（x86_64-pc-windows-gnu）
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-x86_64-pc-windows-gnu
          path: dist-stdlib/x86_64-pc-windows-gnu/libdial_std.a
          if-no-files-found: error
          retention-days: 7

      - name: 打包发布 zip（windows-x86_64，含 LLVM-C.dll）
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          LLVM18_DIR: C:\llvm18
        run: bash tools/package_release.sh windows-x86_64 target/x86_64-pc-windows-gnu/release/dialc.exe

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-windows-x86_64
          path: dialc-v*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Termux aarch64（musl 全静态）—— 原生 ARM64 宿主 + Alpine 容器构建
  #   ubuntu-24.04-arm 是 GitHub 免费提供的**原生 ARM64** runner；在其上跑
  #   arm64v8/alpine 容器是原生执行（无需 QEMU），彻底绕开 QEMU binfmt 故障。
  #   Alpine 提供 musl 原生的 LLVM 18 静态库，全程 musl，产物完全静态。
  # ===========================================================================
  build-termux:
    name: Termux aarch64（musl 全静态核心冒烟）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 docker 可用（ARM64 宿主原生运行 arm64 容器）
        run: docker --version || { sudo apt-get update && sudo apt-get install -y docker.io && sudo systemctl start docker; }

      - name: 在 Alpine aarch64 容器内原生构建（Docker，无 QEMU）
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work arm64v8/alpine:3.22 sh -c '
            set -euo pipefail
            apk add --no-cache curl bash git make binutils zip unzip gcc g++ clang \
              zlib-static zstd-static xz-static ncurses-static libxml2-static libffi-dev \
              llvm18-dev llvm18-static
            # 强制静态链接 libffi：产物里若残留 NEEDED libffi.so.8，Termux（无该库）
            # 上执行会直接 not found。libffi.a 由 libffi-dev 提供，删掉 .so 让链接器
            # 只能命中静态归档（实测 --system-libs 并不含 -lffi，它来自别处的符号解析）。
            rm -f /usr/lib/libffi.so*
            # 确保 LLVM_SYS_181_PREFIX 下有 llvm-config（Alpine 只提供 llvm-config-18）
            [ -e /usr/lib/llvm18/bin/llvm-config ] \
              || ln -sf /usr/bin/llvm-config-18 /usr/lib/llvm18/bin/llvm-config
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-host aarch64-unknown-linux-musl --profile minimal
            source "$HOME/.cargo/env"
            # 关键：inkwell 的 llvm18-1-prefer-dynamic 会让 llvm-sys **主动优先动态**
            # 链接 libLLVM.so；那样的二进制在 Termux（无 glibc/musl 加载器）上无法执行。
            # llvm-sys 没有 *_STATIC 环境变量可覆盖，故用「只静态」垫片接管 llvm-config：
            # 它对 --libnames --link-shared 返回非零，迫使 llvm-sys 回退到 --link-static。
            mkdir -p /usr/local/llvm18-static/bin
            cp tools/llvm-config-static-linux.sh /usr/local/llvm18-static/bin/llvm-config
            chmod 0755 /usr/local/llvm18-static/bin/llvm-config
            export LLVM_CONFIG_REAL=llvm-config-18
            export LLVM_SYS_181_PREFIX=/usr/local/llvm18-static
            "/usr/local/llvm18-static/bin/llvm-config" --version
            echo "--- 静态库名（应含 libLLVM.a）---"
            "/usr/local/llvm18-static/bin/llvm-config" --libnames --link-static | head -c 200; echo
            echo "--- 原始 --system-libs --link-static（与 llvm-sys 调用顺序一致）---"
            llvm-config-18 --system-libs --link-static
            echo "--- 对照：--link-static --system-libs ---"
            llvm-config-18 --link-static --system-libs
            echo "--- libffi 静态归档是否存在 ---"
            ls -la /usr/lib/libffi.a /usr/lib/*/libffi.a 2>/dev/null || echo "(未找到 libffi.a)"
            echo "--- 垫片输出 --system-libs --link-static ---"
            "/usr/local/llvm18-static/bin/llvm-config" --system-libs --link-static
            # 完全静态：musl libc 静态（crt-static）+ 显式用 GCC 链接器（musl gcc，稳定且支持经典 -static），
            # 连同 libstdc++/libgcc/libz/libzstd/libxml2/libffi/liblzma 一并静态，产出单文件无动态依赖的 dialc。
            # （注：linker-features=-lld 在 musl 目标上是 unstable，需 -Z unstable-options，故改用 -C linker=gcc）
            # -lgcc：libLLVM.a 各组件引用 __clear_cache，该符号由 libgcc.a 提供；
            #        全静态时它不会自动进入链接，需显式补上（放最后以解析前面的未定义符号）。
            export RUSTFLAGS="-C target-feature=+crt-static -C linker=gcc -C link-arg=-static -C link-arg=-lgcc -C link-arg=/usr/lib/libffi.a"
            echo "RUSTFLAGS=$RUSTFLAGS"
            rustc --version && llvm-config-18 --version
            echo "--- llvm-config --link-static --libs ---"; llvm-config-18 --link-static --libs | head -c 300; echo
            cargo build --release --target aarch64-unknown-linux-musl --locked
            BIN=target/aarch64-unknown-linux-musl/release/dialc
            ls -la "$BIN"
            echo "--- INTERP ---"; readelf -l "$BIN" | grep -A1 INTERP || echo "(无可执行解释器 = 完全静态)"
            echo "--- NEEDED ---"; readelf -d "$BIN" | grep NEEDED || echo "(无动态依赖)"
            "$BIN" build examples/hello.dial -o /tmp/hello
            /tmp/hello | tee /tmp/hello.out
            grep -q "Hello, dialc" /tmp/hello.out || { echo "❌ 输出不符"; exit 1; }
            echo "✅ Termux 冒烟通过"
            echo "--- 用户程序依赖（仅供参考，用户侧由 Termux 自带编译器产出 bionic 程序）---"
            readelf -d /tmp/hello 2>/dev/null | grep -c NEEDED | xargs -I{} echo "用户程序动态依赖数: {}"
            # 阶段 7：预编译官方标准库（runtime + stdlib）为单份 musl 静态库。
            # 容器内的 gcc 即 musl gcc，产出与 dialc 同目标的 aarch64 musl .a。
            bash tools/build_stdlib.sh dist-stdlib/aarch64-unknown-linux-musl/libdial_std.a 1
            bash tools/package_release.sh termux-aarch64 "$BIN"
          '

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-termux-aarch64
          path: dialc-v*-termux-aarch64.zip
          if-no-files-found: error
          retention-days: 7

      - name: 上传标准库静态库（aarch64-unknown-linux-musl）
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-aarch64-unknown-linux-musl
          path: dist-stdlib/aarch64-unknown-linux-musl/libdial_std.a
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # 阶段 7：发布官方标准库 stdlib.dialpkg（独立 Release，与编译器解耦）
  #   仅在打 stdlib-v* 标签时触发；收集三平台预编译的 libdial_std.a，组装成
  #   stdlib.dialpkg 并发布到与该标签同名的独立 GitHub Release。
  # ===========================================================================
  publish-stdlib:
    name: 打包并发布标准库 stdlib.dialpkg
    needs: [build-linux, build-windows, build-termux]
    if: startsWith(github.ref, 'refs/tags/stdlib-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 上传 Release 产物需要

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取回三平台标准库静态库
        uses: actions/download-artifact@v4
        with:
          pattern: stdlib-*
          path: stdlib-artifacts
          merge-multiple: false

      - name: 组装 stdlib.dialpkg
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -R stdlib-artifacts
          # 版本号取标签去掉 stdlib-v 前缀（stdlib-v1.0.0 -> 1.0.0）
          PKG_VER="${GITHUB_REF_NAME#stdlib-v}"
          python3 tools/make_stdlib_pkg.py \
            --diali stdlib/stdlib.diali \
            --out dist-stdlib/stdlib.dialpkg \
            --version "$PKG_VER" --abi 1 \
            "x86_64-linux-gnu:stdlib-artifacts/stdlib-x86_64-linux-gnu/libdial_std.a" \
            "x86_64-pc-windows-gnu:stdlib-artifacts/stdlib-x86_64-pc-windows-gnu/libdial_std.a" \
            "aarch64-unknown-linux-musl:stdlib-artifacts/stdlib-aarch64-unknown-linux-musl/libdial_std.a"
          echo "--- stdlib.dialpkg 内容 ---"
          unzip -l dist-stdlib/stdlib.dialpkg

      - name: 上传到 GitHub Release（stdlib 独立发布）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: stdlib v${{ github.ref_name }}
          files: dist-stdlib/stdlib.dialpkg
          overwrite: true          # 允许重发时覆盖同名资产（重指标签重跑发布用）
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 官方标准库 `stdlib.dialpkg`（独立发布，与 dialc 解耦）

            三平台预编译（x86_64-linux-gnu / x86_64-pc-windows-gnu / aarch64-unknown-linux-musl），
            统一以 **ReleaseSafe（`DIAL_SAFETY=1`）** 级别预编译，作为越界/空指针的保底防线。

            ### 安装
            ```bash
            dialc install https://github.com/shichencike/Dial/releases/download/stdlib-v<版本>/stdlib.dialpkg
            ```
            或把 `stdlib.dialpkg` 放到项目目录后执行 `dialc install stdlib.dialpkg`。
            dialc 链接时会自动优先使用已安装的标准库包；`abi` 不兼容会明确报错并给出重装方案，
            绝不静默链入不兼容的二进制。

  # ===========================================================================
  # 发布：tag 触发，收集三平台产物上传到 GitHub Release
  # ===========================================================================
  release:
    name: 打包并发布（三平台）
    needs: [build-linux, build-windows, build-termux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 上传 Release 产物需要

    steps:
      - name: 取回三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: false

      - name: 列出待发布资产
        run: find dist -name 'dialc-v*.zip' -printf '  %p (%s 字节)\n'

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/dialc-v*.zip
          overwrite: true          # 允许重发时覆盖同名资产（重指标签重跑发布用）
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## dialc 三平台发布包

            本次发布为三个平台各提供一个**精简二进制分发包**，命名 `dialc-v<版本>-<平台>.zip`：

            | 平台 | 文件名 slug | 运行环境要求 |
            | --- | --- | --- |
            | **Linux x86_64** | `linux-x86_64` | 动态 glibc；运行期需系统装有 libLLVM-18（apt.llvm.org 的 llvm-18，或设置 `LD_LIBRARY_PATH` 指向 `libLLVM-18.so`） |
            | **Windows x64** | `windows-x86_64` | MinGW（gnu）目标；`dialc.exe` 运行期需同目录的 `LLVM-C.dll`（已随包分发）；编译你的 `.dial` 程序需 MinGW-w64 工具链（gcc + winpthreads），产物为单文件 `.exe` |
            | **Termux aarch64** | `termux-aarch64` | **musl 全静态**，单文件、无外部依赖；编译你的程序仅需本机 `gcc`/`clang` |

            ### 安装

            ```bash
            # Linux / Termux
            curl -LO https://github.com/shichencike/Dial/releases/latest/download/dialc-v<版本>-linux-x86_64.zip
            unzip dialc-v<版本>-linux-x86_64.zip && cd Dial && sudo bash install-dial.sh

            # Windows（PowerShell）
            irm https://raw.githubusercontent.com/shichencike/Dial/main/tools/install-dial.ps1 | iex
            ```

            每个包内含 `dialc`(`dialc.exe`)、`stdlib/`、`runtime/`、四份许可文件、对应安装脚本，以及编译发布流程 `.github/workflows/ci.yml`。
