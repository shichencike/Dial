# dialc —— 三平台编译 / 测试 / 发布流水线（GitHub Actions）
#
# 三个构建作业，各平台**原生构建**（CI 用对应宿主 runner / 容器，编译期目标即运行期平台）：
#   build-linux     Linux x86_64（动态 glibc）—— 全量 A~L 端到端测试 + 锚点/官网同步校验
#   build-windows   Windows x64（MinGW / gnu）—— 核心冒烟（编译+运行+平台契约）
#   build-termux    Termux aarch64（musl 全静态）—— 核心冒烟
# 发布作业在打 `v*` 标签时把三个平台的产物上传到 GitHub Release。
#
# 平台决策（用户拍板 + 工具链可得性约束）：
#   - Linux x86_64      : glibc 动态链接，运行期需要系统 libLLVM-18
#   - Windows x64       : MinGW（x86_64-pc-windows-gnu）。LLVM 用官方 MSVC 构建的 18 全量包，
#                         仅取 C 接口（LLVM-C.lib 导入库 + LLVM-C.dll 运行期），纯 C ABI 跨工具链无冲突；
#                         stdlib 的 pthread 代码由 winpthreads 提供，无需改写（阶段 6 的 Win32 后端可延后）。
#   - Termux aarch64    : musl 全静态（单文件、无外部依赖），在原生 ARM64 宿主
#                         （ubuntu-24.04-arm）的 Alpine aarch64 容器内构建。
#   注：LLVM 18 必须保留——Alpine 3.22 恰好只提供 llvm18，升版会断 Termux 路线。
#   注：MSYS2 现仅提供 LLVM 23、WinLibs 的 18.x 已下架，故 Windows 走官方 MSVC 包 + C 接口路线。

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新推送会取消旧运行，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Linux x86_64 —— 全量测试（A~L 十二组）+ 文档/官网同步校验
  # ===========================================================================
  build-linux:
    name: Linux x86_64（全量测试）
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 LLVM 18 与工具链
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget gnupg ca-certificates lsb-release software-properties-common \
            zip unzip python3 python3-venv python3-pip build-essential
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18 all
          sudo apt-get install -y --no-install-recommends \
            llvm-18-dev libpolly-18-dev clang-18 zlib1g-dev
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          clang --version | head -1
          llvm-config-18 --version

      - name: 安装 Python 依赖（官网生成器）
        run: |
          set -euo pipefail
          python3 -m venv /tmp/webvenv
          /tmp/webvenv/bin/pip install --quiet --upgrade pip
          /tmp/webvenv/bin/pip install --quiet "markdown==3.10.1"
          /tmp/webvenv/bin/python -c "import markdown; print('markdown', markdown.__version__)"
          echo "WEBPY=/tmp/webvenv/bin/python" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: 编译 dialc（release）
        run: cargo build --release --locked

      - name: 端到端测试（A~L 共十二组）
        run: bash tests/run_tests.sh

      - name: 校验内部锚点（README / CHANGELOG）
        run: python3 tools/check_links.py

      - name: 校验官网产物与文档同步
        run: |
          set -euo pipefail
          "$WEBPY" tools/build_web.py
          if ! git diff --exit-code -- web/; then
            echo "::error::web/ 与文档不同步，请本地运行 python3 tools/build_web.py 后提交 web/"
            git diff --stat -- web/
            exit 1
          fi
          echo "✅ web/ 与文档同步"

      - name: 打包发布 zip（linux-x86_64）
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash tools/package_release.sh linux-x86_64 target/release/dialc

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-linux-x86_64
          path: dialc-v*-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Windows x64（MinGW / gnu）—— 核心冒烟
  # ===========================================================================
  build-windows:
    name: Windows x64（MinGW 核心冒烟）
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      # 注意：Windows 上 Rust 的 Command::new 对无扩展名路径只补 .exe、不补 .cmd，
      # 因此 LLVM_SYS_181_PREFIX 指向的 llvm-config（.cmd 垫片）无法被 llvm-sys 解析。
      # 改为把 C:\llvm-shim\bin 放进 PATH，让 llvm-sys 在 PATH 中按 PATHEXT 裸名找到 llvm-config.cmd。
      LLVM18_DIR: C:\llvm18

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 MinGW-w64（gcc + winpthreads，供编译用户程序）
        shell: bash
        run: choco install mingw -y

      - name: 下载并解压官方 LLVM 18（MSVC 全量包，提供 C 接口：LLVM-C.lib / LLVM-C.dll / 头文件）
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o /tmp/llvm18.tar.xz \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-pc-windows-msvc.tar.xz
          mkdir -p "$LLVM18_DIR"
          tar -xf /tmp/llvm18.tar.xz -C "$LLVM18_DIR" --strip-components=1
          ls "$LLVM18_DIR/bin/LLVM-C.dll" "$LLVM18_DIR/lib/LLVM-C.lib"

      - name: 放置 llvm-config 垫片（让 llvm-sys 把 LLVM 当 C 接口链接）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /c/llvm-shim/bin
          cp tools/llvm-config.win.cmd /c/llvm-shim/bin/llvm-config.cmd
          "/c/llvm-shim/bin/llvm-config.cmd" --version

      - name: 安装 Rust 工具链并加 MinGW 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 编译 dialc（release，x86_64-pc-windows-gnu）
        shell: bash
        env:
          PATH: C:\llvm-shim\bin;C:\tools\mingw64\bin;C:\llvm18\bin:$PATH
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: |
          set -euo pipefail
          # windows-2022 runner 已预装 rustup，dtolnay action 不会把 cargo 写进 PATH，需手动补
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          cargo build --release --target x86_64-pc-windows-gnu --locked
          ls -la target/x86_64-pc-windows-gnu/release/dialc.exe

      - name: 核心冒烟：编译并运行示例
        shell: bash
        env:
          PATH: C:\tools\mingw64\bin;C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          BIN=target/x86_64-pc-windows-gnu/release/dialc.exe
          # dialc.exe 运行期需要 LLVM-C.dll（已在 PATH 的 C:\llvm18\bin 中）
          "$BIN" --version 2>/dev/null || true
          "$BIN" build examples/hello.dial -o /tmp/hello.exe
          /tmp/hello.exe | tee /tmp/hello.out
          grep -q "Hello, dialc" /tmp/hello.out && echo "✅ Windows 冒烟通过" || { echo "❌ 输出不符"; exit 1; }

      - name: 平台契约：用户程序不依赖 LLVM-C.dll
        shell: bash
        env:
          PATH: C:\tools\mingw64\bin;C:\llvm18\bin:$PATH
        run: |
          set -euo pipefail
          BIN=target/x86_64-pc-windows-gnu/release/dialc.exe
          "$BIN" build examples/hello.dial -o /tmp/hello2.exe
          # 用 llvm-readobj / dumpbin 检查导入表：只允许系统 DLL，不应出现 LLVM-C.dll（那是 dialc.exe 自己的依赖）
          if command -v llvm-readobj >/dev/null 2>&1; then
            IMPORTS=$(llvm-readobj --coff-imports /tmp/hello2.exe 2>/dev/null | grep -i "LLVM" || true)
          else
            IMPORTS=""
          fi
          if [ -n "$IMPORTS" ]; then echo "❌ 用户程序依赖 LLVM"; echo "$IMPORTS"; exit 1; fi
          echo "✅ 用户程序无 LLVM 依赖"

      - name: 打包发布 zip（windows-x86_64，含 LLVM-C.dll）
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          LLVM18_DIR: C:\llvm18
        run: bash tools/package_release.sh windows-x86_64 target/x86_64-pc-windows-gnu/release/dialc.exe

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-windows-x86_64
          path: dialc-v*-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Termux aarch64（musl 全静态）—— 原生 ARM64 宿主 + Alpine 容器构建
  #   ubuntu-24.04-arm 是 GitHub 免费提供的**原生 ARM64** runner；在其上跑
  #   arm64v8/alpine 容器是原生执行（无需 QEMU），彻底绕开 QEMU binfmt 故障。
  #   Alpine 提供 musl 原生的 LLVM 18 静态库，全程 musl，产物完全静态。
  # ===========================================================================
  build-termux:
    name: Termux aarch64（musl 全静态核心冒烟）
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 docker 可用（ARM64 宿主原生运行 arm64 容器）
        run: docker --version || { sudo apt-get update && sudo apt-get install -y docker.io && sudo systemctl start docker; }

      - name: 在 Alpine aarch64 容器内原生构建（Docker，无 QEMU）
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work arm64v8/alpine:3.22 sh -c '
            set -euo pipefail
            apk add --no-cache curl bash git make binutils zip unzip gcc g++ clang \
              zlib-static zstd-static libxml2-static libffi-dev \
              llvm18-dev llvm18-static
            # 确保 LLVM_SYS_181_PREFIX 下有 llvm-config（Alpine 只提供 llvm-config-18）
            [ -e /usr/lib/llvm18/bin/llvm-config ] \
              || ln -sf /usr/bin/llvm-config-18 /usr/lib/llvm18/bin/llvm-config
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-host aarch64-unknown-linux-musl --profile minimal
            source "$HOME/.cargo/env"
            export LLVM_SYS_181_PREFIX=/usr/lib/llvm18
            # 完全静态链接：musl libc 静态（crt-static）+ C++ 运行时（libstdc++/libgcc）也静态（-static），
            # 产出单文件无动态依赖的 dialc（满足 Termux「musl 全静态」要求，且运行不再依赖解释器）。
            export RUSTFLAGS="-C target-feature=+crt-static -C link-arg=-static"
            rustc --version && llvm-config-18 --version
            cargo build --release --target aarch64-unknown-linux-musl --locked
            ls -la target/aarch64-unknown-linux-musl/release/dialc
            file target/aarch64-unknown-linux-musl/release/dialc || true
            ldd target/aarch64-unknown-linux-musl/release/dialc 2>&1 | head || true
            ./target/aarch64-unknown-linux-musl/release/dialc build examples/hello.dial -o /tmp/hello
            /tmp/hello | tee /tmp/hello.out
            grep -q "Hello, dialc" /tmp/hello.out || { echo "❌ 输出不符"; exit 1; }
            echo "✅ Termux 冒烟通过"
            readelf -d /tmp/hello 2>/dev/null | grep -q "Shared library" \
              && { echo "❌ 存在动态依赖"; readelf -d /tmp/hello; exit 1; } \
              || echo "✅ 用户程序完全静态（无动态依赖）"
            bash tools/package_release.sh termux-aarch64 target/aarch64-unknown-linux-musl/release/dialc
          '

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: dialc-termux-aarch64
          path: dialc-v*-termux-aarch64.zip
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # 发布：tag 触发，收集三平台产物上传到 GitHub Release
  # ===========================================================================
  release:
    name: 打包并发布（三平台）
    needs: [build-linux, build-windows, build-termux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # 上传 Release 产物需要

    steps:
      - name: 取回三平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: false

      - name: 列出待发布资产
        run: find dist -name 'dialc-v*.zip' -printf '  %p (%s 字节)\n'

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/dialc-v*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## dialc 三平台发布包

            本次发布为三个平台各提供一个**精简二进制分发包**，命名 `dialc-v<版本>-<平台>.zip`：

            | 平台 | 文件名 slug | 运行环境要求 |
            | --- | --- | --- |
            | **Linux x86_64** | `linux-x86_64` | 动态 glibc；运行期需系统装有 libLLVM-18（apt.llvm.org 的 llvm-18，或设置 `LD_LIBRARY_PATH` 指向 `libLLVM-18.so`） |
            | **Windows x64** | `windows-x86_64` | MinGW（gnu）目标；`dialc.exe` 运行期需同目录的 `LLVM-C.dll`（已随包分发）；编译你的 `.dial` 程序需 MinGW-w64 工具链（gcc + winpthreads），产物为单文件 `.exe` |
            | **Termux aarch64** | `termux-aarch64` | **musl 全静态**，单文件、无外部依赖；编译你的程序仅需本机 `gcc`/`clang` |

            ### 安装

            ```bash
            # Linux / Termux
            curl -LO https://github.com/shichencike/Dial/releases/latest/download/dialc-v<版本>-linux-x86_64.zip
            unzip dialc-v<版本>-linux-x86_64.zip && cd Dial && sudo bash install-dial.sh

            # Windows（PowerShell）
            irm https://raw.githubusercontent.com/shichencike/Dial/main/tools/install-dial.ps1 | iex
            ```

            每个包内含 `dialc`(`dialc.exe`)、`stdlib/`、`runtime/`、四份许可文件与对应安装脚本。
